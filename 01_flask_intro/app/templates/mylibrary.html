{% extends "base.html" %}

{% block content %}
    <h1>{{ username }}'s Library</h1>
    {% for book in books %}
    <div>
        <p><b>{{ book.title }}</b> — {{ book.author }}</p>
        <p style="color: red">
            {% if book.is_read %}
            Read
            {% else %}
            Not read yet
            {% endif %}
        </p>
    </div>
    {% endfor %}
{% endblock %}
